{% extends "layout_sidebar.html" %}
{% block title %}Invite Staff{% endblock %}
{% block topbar_title %}Invite Staff Member{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="df-card">
      <div class="df-card-header"><h6><i class="bi bi-person-plus me-1"></i> Invite Staff Member</h6></div>
      <div class="df-card-body">
        <p class="text-muted mb-3" style="font-size:0.85rem;">
          Enter details for a new staff account, or invite an existing user by their phone number.
        </p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" required placeholder="staff_username"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="text" name="phone" class="form-control" required placeholder="+91 9876543210"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email <span class="text-muted fw-normal">(optional)</span></label>
            <input type="email" name="email" class="form-control" placeholder="staff@firm.com"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required minlength="6"/>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Organization Role</label>
            <select name="org_role" class="form-select">
              <option value="staff">Staff</option>
              <option value="manager">Manager</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn-accent btn">
              <i class="bi bi-send me-1"></i> Invite
            </button>
            <a href="{{ url_for('org.staff_list') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
