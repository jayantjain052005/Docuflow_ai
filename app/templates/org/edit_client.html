{% extends "layout_sidebar.html" %}
{% block title %}Edit {{ client.full_name }}{% endblock %}
{% block topbar_title %}Edit Client{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="df-card">
      <div class="df-card-header">
        <h6><i class="bi bi-pencil me-1"></i> Edit Client — {{ client.full_name }}</h6>
      </div>
      <div class="df-card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name <span style="color:var(--accent)">*</span></label>
            <input type="text" name="full_name" class="form-control" required value="{{ client.full_name }}"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Primary Phone</label>
            <input type="text" name="primary_phone" class="form-control" value="{{ client.primary_phone or '' }}"/>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" value="{{ client.email or '' }}"/>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn-accent btn">
              <i class="bi bi-check-circle me-1"></i> Save Changes
            </button>
            <a href="{{ url_for('org.view_client', client_id=client.id) }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
