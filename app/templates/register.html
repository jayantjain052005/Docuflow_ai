<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — DocuFlow AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --ink:#0d0d0d; --paper:#f5f2eb; --accent:#c84b31; --accent-3:#e8b64b;
      --surface:#fff; --border:rgba(13,13,13,0.10);
      --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
    }
    body { font-family:var(--font-body); background:var(--paper); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .auth-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:2.5rem 2rem; max-width:520px; width:100%; box-shadow:0 8px 32px rgba(13,13,13,0.10); }
    .auth-logo { font-family:var(--font-display); font-size:1.5rem; font-weight:800; color:var(--ink); }
    .auth-logo span { color:var(--accent); }
    .form-control-custom { width:100%; padding:0.65rem 0.9rem; border-radius:8px; border:1px solid var(--border); font-size:0.9rem; font-family:var(--font-body); }
    .form-control-custom:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(200,75,49,0.12); outline:none; }
    .form-group { margin-bottom:1rem; }
    label { display:block; font-size:0.83rem; font-weight:600; color:#3a3a3a; margin-bottom:0.35rem; }
    .btn-auth { width:100%; background:var(--ink); color:#fff; border:none; border-radius:8px; font-weight:700; padding:0.65rem 1.5rem; font-size:0.92rem; }
    .btn-auth:hover { background:var(--accent); color:#fff; }
    .type-toggle { display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .type-toggle input[type=radio] { display:none; }
    .type-toggle label { flex:1; text-align:center; padding:0.6rem; cursor:pointer; font-size:0.85rem; font-weight:600; transition:all 0.15s; }
    .type-toggle input[type=radio]:checked + label { background:var(--ink); color:#fff; }
    .pro-fields { display:none; }
    .pro-fields.visible { display:block; }
  </style>
</head>
<body>
<div class="auth-box">
  <div class="text-center mb-4">
    <div class="auth-logo mb-1">Docu<span>Flow</span> AI</div>
    <p class="text-muted mb-0" style="font-size:0.85rem;">
      {{ 'Create firm admin account' if admin_create else 'Create your account' }}
    </p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} py-2 mb-3" style="font-size:0.85rem;border-radius:8px;">{{ msg }}</div>
    {% endfor %}
  {% endif %}
  {% endwith %}

  <form method="POST">
    <!-- Account type toggle -->
     <div class="form-group">
    <label for="full_name">Full Name</label>

    <input
        type="text"
        id="full_name"
        name="full_name"
        class="form-control-custom"
        required
    >
</div>

<div class="form-group">
    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        class="form-control-custom"
        required
    >
</div>

<div class="form-group">
    <label for="mobile">Mobile Number</label>

    <input
        type="tel"
        id="mobile"
        name="mobile"
        class="form-control-custom"
    >
</div>

<div class="form-group">
    <label for="firm_name">CA Firm Name</label>

    <input
        type="text"
        id="firm_name"
        name="firm_name"
        class="form-control-custom"
        required
    >
</div>

<div class="form-group">
    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        name="password"
        class="form-control-custom"
        required
    >
</div>

<div class="form-group">
    <label for="confirm_password">Confirm Password</label>

    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        class="form-control-custom"
        required
    >
</div>
  <button
    type="submit"
    class="btn-auth"
>
    Create Account
</button>
      </form>

  <div class="text-center mt-3" style="font-size:0.85rem;">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>

<script>
const radios = document.querySelectorAll('input[name="account_type"]');
const proFields = document.getElementById('proFields');
radios.forEach(r => r.addEventListener('change', () => {
  proFields.classList.toggle('visible', r.value === 'professional' && r.checked);
}));
</script>
</body>
</html>
