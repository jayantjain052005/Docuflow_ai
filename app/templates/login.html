{% extends "base.html" %}
{% block title %}Login — DocuFlow AI{% endblock %}

{% block extra_head %}
<style>
  body { background: var(--paper); }

  .auth-wrapper {
    min-height: calc(100vh - 62px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .auth-header {
    background: var(--ink);
    color: var(--paper);
    padding: 2rem 2rem 1.75rem;
    text-align: center;
  }
  .auth-header .icon-wrap {
    width: 52px; height: 52px;
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 1rem;
  }
  .auth-header h1 {
    font-size: 1.5rem;
    letter-spacing: -0.4px;
    color: var(--paper);
  }
  .auth-header p {
    font-size: 0.86rem;
    color: rgba(245,242,235,0.65);
    margin-top: 0.3rem;
  }

  .auth-body { padding: 1.75rem 2rem 2rem; }

  .input-icon-wrap {
    position: relative;
  }
  .input-icon-wrap .bi {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    font-size: 0.95rem;
    pointer-events: none;
  }
  .input-icon-wrap .form-control-custom {
    padding-left: 2.4rem;
  }

  .auth-footer {
    border-top: 1.5px solid var(--border);
    padding: 1.1rem 2rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: var(--paper);
  }
  .auth-footer a { color: var(--accent); font-weight: 600; }

  .btn-auth {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.7rem;
    border-radius: 9px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 0.5rem;
    letter-spacing: 0.3px;
  }
  .btn-auth:hover { background: var(--accent); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper" style="margin: -2.5rem -1.5rem; padding: 2rem 1.5rem;">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon-wrap"><i class="bi bi-shield-lock-fill"></i></div>
      <h1>Welcome back</h1>
      <p>Sign in to access your CA firm dashboard</p>
    </div>

    <div class="auth-body">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label-custom" for="email">Email Address</label>
          <div class="input-icon-wrap">
            <i class="bi bi-person"></i>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control-custom"
              placeholder="Enter your email"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label-custom" for="password">Password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock"></i>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control-custom"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <button type="submit" class="btn-auth">
          <i class="bi bi-arrow-right-circle-fill"></i> Sign In
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
