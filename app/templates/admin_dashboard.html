<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<h1>Admin Dashboard</h1>

<h2>Users</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Phone</th>
        <th>Admin</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.phone }}</td>
        <td>{{ user.is_admin }}</td>
    </tr>
    {% endfor %}
</table>

<br><br>

<h2>Documents</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Filename</th>
        <th>Owner</th>
    </tr>

    {% for doc in documents %}
    <tr>
        <td>{{ doc.id }}</td>
        <td>{{ doc.filename }}</td>
        <td>{{ doc.owner_user_id }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
