{% extends "base.html" %}
{% block title %}Add Client - DocuFlow AI{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Add Client</h1>
    <p class="subtitle">Create client profile for matching and routing.</p>
  </div>
  <a href="{{ url_for('clients.client_list') }}" class="btn-outline-custom">
    <i class="bi bi-arrow-left"></i> Clients
  </a>
</div>

<div class="card-custom">
  <div class="card-body">
    <form method="POST">
      <div class="row">
        <div class="col-md-6 form-group">
          <label class="form-label-custom" for="client_name">Client Name</label>
          <input class="form-control-custom" id="client_name" type="text" name="client_name" placeholder="Jayant Jain" required>
        </div>

        <div class="col-md-6 form-group">
          <label class="form-label-custom" for="mobile">Mobile</label>
          <input class="form-control-custom" id="mobile" type="tel" name="mobile" placeholder="+91 9876543210" pattern="[0-9+\-\s]{7,15}" title="Enter a valid phone number">
        </div>

        <div class="col-md-6 form-group">
          <label class="form-label-custom" for="email">Email</label>
          <input class="form-control-custom" id="email" type="email" name="email" placeholder="client@example.com">
        </div>

        <div class="col-md-6 form-group">
          <label class="form-label-custom" for="pan_number">PAN</label>
          <input class="form-control-custom" id="pan_number" type="text" name="pan_number" placeholder="ABCDE1234F" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" title="PAN format: ABCDE1234F" oninput="this.value=this.value.toUpperCase()" required>
        </div>

        <div class="col-md-6 form-group">
          <label class="form-label-custom" for="aadhaar_number">Aadhaar</label>
          <input class="form-control-custom" id="aadhaar_number" type="text" name="aadhaar_number" placeholder="1234 5678 9012" pattern="[0-9 ]{12,14}" title="12-digit Aadhaar number">
        </div>

        <div class="col-md-6 form-group">
          <label class="form-label-custom" for="client_type">Client Type</label>
          <select class="form-control-custom" id="client_type" name="client_type">
            <option value="personal">Personal</option>
            <option value="business">Business</option>
            <option value="huf">HUF</option>
            <option value="company">Company</option>
          </select>
        </div>
      </div>

      <label class="d-flex align-items-center gap-2 mb-4" style="font-weight:600;color:var(--ink-mid);">
        <input type="checkbox" name="is_primary_personal">
        Primary Personal PAN
      </label>

      <button type="submit" class="btn-primary-custom">
        <i class="bi bi-check2-circle"></i> Save Client
      </button>
    </form>
  </div>
</div>
{% endblock %}
